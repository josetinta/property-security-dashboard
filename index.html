*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050506;font-family:'Figtree','Segoe UI',Roboto,Arial,sans-serif;color:#eceef2}
#stage{position:absolute;left:0;top:0;width:1494px;height:840px;transform-origin:0 0;overflow:hidden;background:radial-gradient(1100px 600px at 50% 0,#17181c,#08080a 70%)}
#stage>*,#dyn>*{position:absolute}
.pn>*,.bx>*{position:absolute}
.pn{background:linear-gradient(180deg,#17181c,#0f1013);border:1px solid #26282e;border-radius:22px;overflow:hidden}
.pt{left:18px;top:14px;font-size:13.5px;font-weight:600;color:#eceef2;white-space:nowrap}
.mut{color:#868a94}.am{color:#8b7bff}
svg{display:block;overflow:visible}
svg text{font-family:'Figtree','Segoe UI',Arial,sans-serif}
.lang{width:42px;height:30px;line-height:30px;text-align:center;border-radius:15px;background:#101114;color:#9a9ea8;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid #26282e}
.lang:hover{color:#fff}.lang.on{background:#8b7bff;border-color:#8b7bff;color:#0d0a24}
.chip{display:flex;align-items:center;justify-content:center;height:26px;border-radius:13px;background:#1c1d22;color:#a4a8b2;font-size:12.5px;font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
.chip:hover{color:#fff}
.chip.on{background:#8b7bff;color:#0d0a24}
.chip.all{background:#2a2470;color:#cfc8ff}
.chip.na{background:#0f1013;color:#464950;cursor:default}
.rn{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;border:1.5px solid #2c2e34;background:#0e0f12;color:#9a9ea8;cursor:pointer}
.rn:hover{color:#fff;border-color:#5a5d66}.rn.on{border-color:#8b7bff;color:#8b7bff;background:#17143a}
.sb{display:flex;align-items:center;gap:9px;height:46px;padding:0 12px;border-radius:14px;background:rgba(16,17,20,.78);border:1px solid #2c2e34;cursor:pointer;white-space:nowrap}
.sb:hover{border-color:#5a5d66}.sb.on{border-color:#8b7bff;background:rgba(26,22,64,.82)}
.sc{display:flex;align-items:center;justify-content:center;height:24px;padding:0 10px;border-radius:12px;background:#1c1d22;color:#a4a8b2;font-size:11.5px;font-weight:600;cursor:pointer}
.sc:hover{color:#fff}.sc.on{background:#8b7bff;color:#0d0a24}
.ab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:14px;border:1px solid #2c2e34;background:#0f1013;color:#d6d8de;font-size:11.5px;font-weight:600;cursor:pointer;text-align:center;padding:0 4px}
.ab:hover{border-color:#8b7bff;color:#fff}
.gl{display:flex;align-items:center;justify-content:center;height:28px;border-radius:14px;background:rgba(16,17,20,.82);color:#d6d8de;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #2c2e34}
.gl:hover{color:#fff}.gl.on{background:#8b7bff;border-color:#8b7bff;color:#0d0a24}
.pill{display:flex;align-items:center;justify-content:center;height:28px;border-radius:14px;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;cursor:pointer}
.pill.em{background:#1c1d22;color:#e8eaef}
.pill.yt{background:rgba(230,33,23,.14);color:#f2857d}.pill.li{background:rgba(10,102,194,.2);color:#7bb8ec}.pill.pf{background:rgba(139,123,255,.14);color:#b3a8ff}.pill.wa{background:rgba(31,168,85,.15);color:#6bcf94}
.pill:hover{filter:brightness(1.3)}
.hit{pointer-events:auto;cursor:pointer}
.rw{cursor:pointer}
#tip{position:fixed;z-index:90;pointer-events:none;display:none;background:#0a0a0c;border:1px solid #4a4d56;color:#eceef2;font:600 12.5px 'Figtree','Segoe UI',Arial;padding:5px 10px;white-space:nowrap;border-radius:8px}
#tbl{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center}
#tbl.show{display:flex}
#sheet{width:min(1300px,96vw);height:min(720px,88vh);background:#101114;border:1px solid #3a3d45;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;font-family:'Figtree','Segoe UI',Arial,sans-serif}
#sheet .tp{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#1c1d22;border-bottom:1px solid #2c2e34}
#sheet .tp b{flex:1;font-size:16px;color:#8b7bff}
#sheet button{height:30px;padding:0 14px;border:0;border-radius:15px;background:#2a2c32;color:#fff;font-weight:600;cursor:pointer;font-family:inherit}
#sheet button:hover{background:#8b7bff;color:#0d0a24}
#sheet .scr{flex:1;overflow:auto}
#sheet table{border-collapse:collapse;font-size:12.5px;width:100%}
#sheet th{position:sticky;top:0;background:#1c1d22;color:#cfc8ff;padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid #30333a}
#sheet td{padding:5px 9px;border-bottom:1px solid #202227;text-align:right;color:#e8eaef;white-space:nowrap}
#sheet th:nth-child(-n+3),#sheet td:nth-child(-n+3){text-align:left}
#sheet tr:nth-child(even) td{background:#191a1e}
#sheet td[contenteditable]:focus{outline:2px solid #8b7bff;background:#1e1a4a}
</style></head>
